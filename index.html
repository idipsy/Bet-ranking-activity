<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>按流水模式 · 综合原型（后台 + 客户端）</title>
<style>
  * { box-sizing:border-box; }
  html, body { margin:0; padding:0; height:100%; font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif; }
  .app-shell { display:flex; height:100vh; overflow:hidden; }

  .sidebar { width:250px; flex:none; background:#1c2b45; color:#fff; display:flex; flex-direction:column; }
  .sidebar-header { padding:20px 20px 16px; border-bottom:1px solid rgba(255,255,255,.1); }
  .sidebar-header .title { font-size:14px; font-weight:600; }
  .sidebar-header .sub { font-size:11.5px; color:rgba(255,255,255,.55); margin-top:4px; }

  .nav-list { flex:1; padding:12px 0; overflow-y:auto; }
  .nav-item { display:flex; align-items:flex-start; gap:10px; padding:12px 20px; cursor:pointer; border-left:3px solid transparent; color:rgba(255,255,255,.72); }
  .nav-item:hover { background:rgba(255,255,255,.05); color:#fff; }
  .nav-item.active { background:rgba(255,255,255,.08); color:#fff; border-left-color:#1677ff; }
  .nav-item .num { flex:none; width:20px; height:20px; border-radius:50%; background:rgba(255,255,255,.14); display:flex; align-items:center; justify-content:center; font-size:11px; margin-top:1px; }
  .nav-item.active .num { background:#1677ff; }
  .nav-item .txt .main { font-size:13.5px; font-weight:500; line-height:1.5; }
  .nav-item .txt .sub { font-size:11.5px; color:rgba(255,255,255,.5); margin-top:2px; line-height:1.5; }
  .nav-item.active .txt .sub { color:rgba(255,255,255,.65); }

  .sidebar-footer { padding:14px 20px; border-top:1px solid rgba(255,255,255,.1); font-size:11px; color:rgba(255,255,255,.4); line-height:1.7; }

  .content { flex:1; min-width:0; height:100%; background:#eef1f6; }
  .content iframe { width:100%; height:100%; border:none; display:block; }
</style>
</head>
<body>

<div class="app-shell">
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="title">流水活动 · 按流水模式</div>
      <div class="sub">左侧切换查看后台配置 / 客户端展示</div>
    </div>
    <div class="nav-list">
      <div class="nav-item active" data-src="活动计算规则_按流水原型.html" onclick="switchView(this)">
        <span class="num">1</span>
        <span class="txt">
          <div class="main">活动配置-流水活动</div>
          <div class="sub">新增"按流水"单选项，档位规则配置</div>
        </span>
      </div>
      <div class="nav-item" data-src="客户端展示_PC与H5对比_按流水原型.html" onclick="switchView(this)">
        <span class="num">2</span>
        <span class="txt">
          <div class="main">客户端展示（PC / H5）</div>
          <div class="sub">按流水模式的用户端页面，双端对比</div>
        </span>
      </div>
    </div>
    <div class="sidebar-footer">供开发查阅使用<br>点击左侧菜单切换视图</div>
  </div>

  <div class="content">
    <iframe id="viewFrame" src="活动计算规则_按流水原型.html"></iframe>
  </div>
</div>

<script>
function switchView(el){
  document.querySelectorAll('.nav-item').forEach(function(item){ item.classList.remove('active'); });
  el.classList.add('active');
  document.getElementById('viewFrame').src = el.getAttribute('data-src');
}
</script>

</body>
</html>
